[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-cockpit"
version = "0.1.0"
description = "AI 运维驾驶舱 — 多系统监控与根因分析"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "ethanli", email = "lbei8648@163.com" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[project.scripts]
aiops-cockpit = "aiops_cockpit.cli:main"

[tool.setuptools.packages.find]
include = ["aiops_cockpit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
